[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1"

# ---------------- WINDOW ----------------
[window]
dynamic_padding = true
decorations = "full"
title = "Alacritty@Fedora"
opacity = 0.90                 # 0.8 is too transparent for long coding
decorations_theme_variant = "Dark"
startup_mode = "Windowed"
resize_increments = true

[window.dimensions]
columns = 110
lines = 32

[window.class]
instance = "Alacritty"
general = "Alacritty"

# ---------------- SCROLL ----------------
[scrolling]
history = 15000
multiplier = 5

# ---------------- COLORS (Tokyonight untouched) ----------------
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#1a1b26"
foreground = "#dadef2"

[colors.normal]
black = "#32344a"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#ad8ee6"
cyan = "#449dab"
white = "#c1c5e3"

[colors.bright]
black = "#444b6a"
red = "#ff7a93"
green = "#b9f27c"
yellow = "#ff9e64"
blue = "#7da6ff"
magenta = "#bb9af7"
cyan = "#0db9d7"
white = "#f0f1fc"

# ---------------- FONT ----------------
[font]
size = 15.5                     # better density for 1080p/14-15" screens
builtin_box_drawing = true

[font.normal]
family = "Liga SFMono Nerd Font"
style = "Regular"

[font.bold]
family = "Liga SFMono Nerd Font"
style = "Bold"

[font.italic]
family = "Liga SFMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Liga SFMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0 
y = 1

[font.glyph_offset]
x = 0 
y = 0 

# ---------------- CURSOR ----------------
[cursor]
style = { shape = "Underline", blinking = "On" }
blink_interval = 600
unfocused_hollow = true
thickness = 0.18

# ---------------- SELECTION ----------------
[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>"
save_to_clipboard = true

# ---------------- MOUSE ----------------
[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

# ---------------- KEYBOARD ----------------
[keyboard]

[[keyboard.bindings]]
key = "Paste"
action = "Paste"

[[keyboard.bindings]]
key = "Copy"
action = "Copy"

# Clear screen properly
[[keyboard.bindings]]
key = "L"
mods = "Control"
mode = "~Vi"
chars = "\u000c"

# Scroll shortcuts
[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "Home"
mods = "Shift"
mode = "~Alt"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "End"
mods = "Shift"
mode = "~Alt"
action = "ScrollToBottom"

# Clipboard
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

# Search
[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "SearchForward"

[[keyboard.bindings]]
key = "B"
mods = "Control|Shift"
action = "SearchBackward"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
mode = "Vi"
action = "ClearSelection"

# Font reset
[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

# ---------------- GENERAL ----------------
[general]
live_config_reload = true
working_directory = "None"
